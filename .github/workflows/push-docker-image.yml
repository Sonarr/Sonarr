name: Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Sonarr version to publish (e.g., 4.0.16.1)'
        required: true
      branch:
        description: 'Branch name the release is built from'
        required: true
        default: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set Build Date
        shell: bash
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.branch == 'main' }}
            type=raw,value=${{ inputs.branch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ inputs.version }}
            SONARR_BRANCH=${{ inputs.branch }}
            PACKAGE_AUTHOR=github.com/${{ github.repository }}
            SONARR_REPO=${{ github.repository }}
