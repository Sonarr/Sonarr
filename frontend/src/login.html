<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Chrome, Opera, and Firefox OS -->
    <meta
      name="theme-color"
      content="#e8ebf1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b1f26"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#1b1f26" />
    <!-- Android/Apple Phone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <meta name="description" content="Sonarr" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/Content/Images/Icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/Content/Images/Icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/Content/Images/Icons/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="/Content/manifest.json"
      crossorigin="use-credentials"
    />
    <link
      rel="mask-icon"
      href="/Content/Images/Icons/safari-pinned-tab.svg"
      color="#00ccff"
    />
    <link
      rel="shortcut icon"
      type="image/ico"
      href="/favicon.ico"
      data-no-hash
    />
    <meta name="msapplication-config" content="/Content/browserconfig.xml" />

    <link rel="stylesheet" type="text/css" href="/Content/theme.css" />
    <link rel="stylesheet" type="text/css" href="/Content/Fonts/fonts.css" />

    <title>Login - Sonarr</title>

    <script type="text/javascript">
      var theme = '_THEME_';
      var defaultDark = window.matchMedia(
        '(prefers-color-scheme: dark)'
      ).matches;

      document.documentElement.dataset.theme =
        theme === 'dark' || (theme === 'auto' && defaultDark) ? 'dark' : 'light';
    </script>

    <style>
      html {
        background-color: var(--paper);
      }

      body {
        background-color: var(--paper);
        color: var(--textColor);
        font-family: 'Inter', ui-sans-serif, system-ui, 'Helvetica Neue',
          'Helvetica', 'Arial', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .center {
        display: flex;
        justify-content: center;
      }

      .content {
        flex: 0 0 325px;
      }

      .logo {
        width: 40px;
        height: 40px;
      }

      .panel {
        margin-top: 50px;
        border: 1px solid var(--hairline);
        border-radius: 12px;
        background-color: var(--paperCard);
      }

      .panel-header {
        display: flex;
        justify-content: center;
        padding: 24px 24px 0;
      }

      .panel-body {
        padding: 20px 24px 24px;
      }

      .sign-in {
        padding: 10px 0 16px;
        color: var(--inkMuted);
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
        font-size: 11px;
      }

      .form-group {
        margin: 16px 0;
      }

      .form-input {
        box-sizing: border-box;
        padding: 10px 14px;
        width: 100%;
        height: 38px;
        border: 1px solid var(--inputBorderColor);
        border-radius: 8px;
        background-color: var(--inputBackgroundColor);
        color: var(--ink);
        font-size: 14px;
        font-family: inherit;
        line-height: 1.4;
      }

      .form-input::placeholder {
        color: var(--inkFaint);
      }

      .form-input:focus {
        outline: 0;
        border-color: var(--accent);
        background-color: var(--paperCard);
        box-shadow: none;
      }

      .button {
        display: block;
        overflow: hidden;
        margin-top: 20px;
        padding: 11px 20px;
        width: 100%;
        border: 1px solid var(--primaryBorderColor);
        border-radius: 8px;
        background-color: var(--primaryBackgroundColor);
        color: var(--primaryButtonColor);
        vertical-align: middle;
        text-align: center;
        text-decoration: none;
        white-space: nowrap;
        font-weight: 500;
        font-size: 14px;
        font-family: inherit;
        line-height: 1.2;
        cursor: pointer;
      }

      .button:hover {
        border-color: var(--primaryHoverBorderColor);
        background-color: var(--primaryHoverBackgroundColor);
        color: var(--primaryButtonColor);
        text-decoration: none;
      }

      .copy {
        margin-top: 15px;
        color: var(--inkMuted);
        text-align: center;
        font-size: 13px;
      }

      .remember-me-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .remember-me {
        color: var(--inkSoft);
        font-size: 13px;
      }

      .forgot-password {
        margin-left: auto;
        color: var(--inkMuted);
        text-decoration: none;
        font-size: 13px;
      }

      .forgot-password:focus,
      .forgot-password:hover {
        color: var(--ink);
        text-decoration: underline;
      }

      .forgot-password:visited {
        color: var(--inkMuted);
      }

      .login-failed {
        margin-top: 20px;
        color: var(--dangerColor);
        text-align: center;
        font-size: 13px;
      }

      .hidden {
        display: none;
      }

      .oidc-misconfigured-message {
        display: none;
        line-height: 1.4;
        text-align: center;
      }

      .oidc-misconfigured .oidc-misconfigured-message {
        display: block;
      }

      .oidc-only {
        display: none;
      }

      .auth-oidc .forms-only {
        display: none;
      }

      .auth-oidc .oidc-only {
        display: block;
      }

      .oidc-misconfigured #sso-login {
        opacity: 0.5;
        cursor: default;
        pointer-events: none;
      }

      @media (pointer: coarse) {
        .form-input {
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body class="auth-_AUTH_METHOD_">
    <div class="center">
      <div class="content">
        <div class="panel">
          <div class="panel-header">
            <img src="/Content/Images/logo.svg" alt="Image" class="logo" />
          </div>

          <div class="panel-body">
            <div class="sign-in">SIGN IN TO CONTINUE</div>

            <form
              role="form"
              data-parsley-validate=""
              novalidate=""
              class="mb-lg forms-only"
              method="POST"
            >
              <div class="form-group">
                <input
                  type="email"
                  name="username"
                  class="form-input"
                  placeholder="Username"
                  autocomplete="off"
                  pattern=".{1,}"
                  required
                  title="User name is required"
                  autofocus="true"
                  autocapitalize="false"
                />
              </div>

              <div class="form-group">
                <input
                  type="password"
                  name="password"
                  class="form-input"
                  placeholder="Password"
                  required
                />
              </div>

              <div class="remember-me-container">
                <span class="remember-me">
                  <input
                    type="checkbox"
                    name="rememberMe"
                    id="rememberMe"
                    checked="checked"
                  />
                  <label for="rememberMe">Remember Me</label>
                </span>

                <a
                  href="https://wiki.servarr.com/sonarr/faq#help-i-have-locked-myself-out"
                  class="forgot-password"
                  >Forgot your password?</a
                >
              </div>
              <button type="submit" class="button">Login</button>

              <div id="login-failed" class="login-failed hidden">
                Incorrect Username or Password
              </div>
            </form>

            <div class="oidc-only">
              <a id="sso-login" class="button" href="__URL_BASE__/login/sso"
                >Login</a
              >

              <div class="login-failed oidc-misconfigured-message">
                OIDC authentication is enabled, but isn't configured correctly.
                Update the OIDC settings in your config file to continue.
              </div>

              <div id="sso-failed" class="login-failed hidden">
                Unable to sign in with your identity provider
              </div>
            </div>
          </div>
        </div>

        <div id="copy" class="copy hidden">
          <span>&copy;</span>
          <span id="year"></span>
          <span>-</span>
          <span>Sonarr</span>
        </div>
      </div>
    </div>
  </body>

  <script type="text/javascript">
    var yearSpan = document.getElementById('year');
    yearSpan.innerHTML = '2010-' + new Date().getFullYear();

    var copyDiv = document.getElementById('copy');
    copyDiv.classList.remove('hidden');

    if (window.location.search.indexOf('loginFailed=true') > -1) {
      var loginFailedDiv = document.getElementById('login-failed');

      loginFailedDiv.classList.remove('hidden');
    }

    if (window.location.search.indexOf('ssoFailed=true') > -1) {
      var ssoFailedDiv = document.getElementById('sso-failed');

      ssoFailedDiv.classList.remove('hidden');
    }

    var ssoButton = document.getElementById('sso-login');

    if (ssoButton) {
      var params = new URLSearchParams(window.location.search);
      var returnUrl = params.get('returnUrl');
      if (returnUrl) {
        ssoButton.href = ssoButton.href + '?returnUrl=' + encodeURIComponent(returnUrl);
      }
    }
  </script>
</html>
