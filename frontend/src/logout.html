<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Chrome, Opera, and Firefox OS -->
    <meta name="theme-color" content="#3a3f51" />
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#3a3f51" />
    <!-- Android/Apple Phone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />

    <meta name="description" content="Sonarr" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/Content/Images/Icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/Content/Images/Icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/Content/Images/Icons/favicon-16x16.png"
    />
    <link
      rel="manifest"
      href="/Content/manifest.json"
      crossorigin="use-credentials"
    />
    <link
      rel="mask-icon"
      href="/Content/Images/Icons/safari-pinned-tab.svg"
      color="#00ccff"
    />
    <link
      rel="shortcut icon"
      type="image/ico"
      href="/favicon.ico"
      data-no-hash
    />
    <meta name="msapplication-config" content="/Content/browserconfig.xml" />

    <link rel="stylesheet" type="text/css" href="/Content/styles.css" />
    <link rel="stylesheet" type="text/css" href="/Content/Fonts/fonts.css" />

    <title>Signed Out - Sonarr</title>

    <style>
      body {
        background-color: var(--pageBackground);
        color: var(--textColor);
        font-family: 'Roboto', 'open sans', 'Helvetica Neue', Helvetica, Arial,
          sans-serif;
      }

      .center {
        display: flex;
        justify-content: center;
      }

      .content {
        flex: 0 0 325px;
      }

      .logo {
        width: 32px;
        height: 32px;
      }

      .panel {
        margin-top: 50px;
        border-radius: 4px;
      }

      .panel-header {
        display: flex;
        justify-content: center;
        padding: 10px;
        border-top-left-radius: 4px;
        border-top-right-radius: 4px;
        background-color: var(--themeDarkColor);
      }

      .panel-body {
        padding: 20px;
        border-bottom-right-radius: 4px;
        border-bottom-left-radius: 4px;
        background-color: var(--panelBackground);
        text-align: center;
      }

      .signed-out {
        padding: 10px 0;
        text-align: center;
      }

      .description {
        margin-top: 15px;
        font-size: 14px;
        line-height: 1.5;
        color: var(--textDimmedColor);
      }

      .button {
        display: block;
        overflow: hidden;
        margin-top: 20px;
        padding: 10px 0;
        width: 100%;
        border: 1px solid;
        border-color: var(--primaryBorderColor);
        border-radius: 4px;
        background-color: var(--primaryBackgroundColor);
        color: var(--white);
        text-align: center;
        white-space: nowrap;
        line-height: normal;
        text-decoration: none;
        font-size: 13px;
      }

      .button:hover {
        border-color: var(--primaryHoverBorderColor);
        background-color: var(--primaryHoverBackgroundColor);
        color: var(--white);
        text-decoration: none;
      }

      .copy {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="center">
      <div class="content">
        <div class="panel">
          <div class="panel-header">
            <img src="/Content/Images/logo.svg" alt="Sonarr" class="logo" />
          </div>

          <div class="panel-body">
            <div class="signed-out">SUCCESSFULLY SIGNED OUT</div>

            <div class="description">
              You have been successfully signed out of Sonarr. Your session has
              been terminated and all authentication tokens have been cleared.
            </div>

            <a href="__URL_BASE__/" class="button"> Go back to Sonarr </a>
          </div>
        </div>

        <div id="copy" class="copy hidden">
          <span>&copy;</span>
          <span id="year"></span>
          <span>-</span>
          <span>Sonarr</span>
        </div>
      </div>
    </div>
  </body>

  <script type="text/javascript">
    var yearSpan = document.getElementById('year');
    yearSpan.innerHTML = '2010-' + new Date().getFullYear();

    var copyDiv = document.getElementById('copy');
    copyDiv.classList.remove('hidden');

    var light = {
      white: '#fff',
      pageBackground: '#f5f7fa',
      textColor: '#515253',
      textDimmedColor: '#666',
      themeDarkColor: '#3a3f51',
      panelBackground: '#fff',
      primaryBackgroundColor: '#5d9cec',
      primaryBorderColor: '#5899eb',
      primaryHoverBackgroundColor: '#4b91ea',
      primaryHoverBorderColor: '#3483e7',
    };

    var dark = {
      white: '#fff',
      pageBackground: '#202020',
      textColor: '#ccc',
      textDimmedColor: '#eee',
      themeDarkColor: '#494949',
      panelBackground: '#111',
      primaryBackgroundColor: '#5d9cec',
      primaryBorderColor: '#5899eb',
      primaryHoverBackgroundColor: '#4b91ea',
      primaryHoverBorderColor: '#3483e7',
    };

    var theme = '_THEME_';
    var defaultDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var finalTheme =
      theme === 'dark' || (theme === 'auto' && defaultDark) ? dark : light;

    Object.entries(finalTheme).forEach(([key, value]) => {
      document.documentElement.style.setProperty(`--${key}`, value);
    });
  </script>
</html>
